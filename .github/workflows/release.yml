name: Release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
  publish:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build a clean Mac app
        run: /bin/zsh scripts/build.sh
      - name: Package and audit
        run: |
          python3 scripts/package-release.py dist/念念 dist/niannian-macos.zip
          python3 scripts/audit-release.py dist/niannian-macos.zip
          ditto -x -k dist/niannian-macos.zip dist/unpacked-check
          codesign --verify --deep --strict dist/unpacked-check/念念/念念.app
          cd dist
          shasum -a 256 niannian-macos.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: niannian-macos
          path: |
            dist/niannian-macos.zip
            dist/SHA256SUMS.txt
      - name: Publish the versioned download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its original assets."
            exit 0
          fi
          gh release create "$TAG" dist/niannian-macos.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "念念 $TAG" --notes-file docs/RELEASE_NOTES.md --latest
