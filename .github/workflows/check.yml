name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: /bin/zsh scripts/build.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/念念 dist/niannian-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: niannian-macos
          path: dist/niannian-macos.zip
